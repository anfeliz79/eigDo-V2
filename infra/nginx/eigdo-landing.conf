upstream eigdo_landing {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name eigdo.com www.eigdo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name eigdo.com www.eigdo.com;

    ssl_certificate /etc/letsencrypt/live/eigdo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eigdo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://eigdo_landing;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
